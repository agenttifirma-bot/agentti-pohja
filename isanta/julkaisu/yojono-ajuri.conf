# Julkaisun kohde: yojono-ajuri / agentti-pohja (CT115). Vain dataa (ei source). Asennus: /root/julkaisu/yojono-ajuri.conf (root, 0600).
KOHDE=yojono-ajuri
CT=115
REPO=tonyweckstrom1987/agentti-pohja
JULKINEN=1
HAARA=main
KOODI=/opt/yojono-ajuri
KOODI_OMISTAJA=root:root
KOODI_MODE=755
# Nykyinen asennus on git-kloonaus: ensijulkaisu (--ensijulkaisu) vaatii puhtaan git-tyopuun.
KOODI_GIT=1
TILA=/var/lib/yojono
KONFIG=/etc/yojono
PALVELUT=yojono
AJASTIMET=yojono.timer
PROSESSI_KUVIO=python3.-B.-m.yojono
LUKOT=/var/lib/yojono/lukko
IKKUNA_S=600
ASENTAJA=yleinen
POIS=.github
VAADITUT=yojono/ajuri.py agentti/pr_kutsu.py
# CT115:n koko testisarja kaatuu ymparistoeroihin (root, node puuttuu); asennuksen tarkistus kayttaa samaa moduulijoukkoa kuin PR #59:n asennus.
TESTI_TAPA=kontti
TESTI_ARGUMENTIT=test.test_pr_kutsu yojono.test_ajuri test.test_viikkoraportti
SAVU_MODUULIT=yojono.ajuri agentti.pr_kutsu agentti.viikkoraportti
# Toiminnallinen terveystarkistus asennuksen jalkeen (vain luku): yojono tila tulostaa tilan; virhe kumoaa koodin (porras 2, 28.10.2026).
TERVEYS_KOMENTO=python3 -B -m yojono tila
# Skriptikopiot /opt/yojono/*.sh eivat ole osa tata julkaisua: julkaisu vain raportoi erot (`--paivita-skriptit` paivittaa ne).
SKRIPTIT_HAKEMISTO=/opt/yojono
SKRIPTIT_PAKETISSA=yojono
YKSIKOT_ASENNUS=0
PREV_MAARA=3
