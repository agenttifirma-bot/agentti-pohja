# Julkaisun kohde: kauppatiimi (CT119). Vain dataa: julkaise.sh lukee tama tiedoston rivi riviilta (ei source).
# Asennus: /root/julkaisu/kauppatiimi.conf (root, 0600). Salaisuuksia ei saa olla tassa.
KOHDE=kauppatiimi
CT=119
REPO=tonyweckstrom1987/kauppatiimi
JULKINEN=1
HAARA=main
# Koodi (vaihdetaan sisarhakemistona: k1 -> k1.prev-<aika>); tila ja konfiguraatio EIVAT kuulu koodiin.
KOODI=/srv/kauppa/k1
KOODI_OMISTAJA=kauppa:kauppa
KOODI_MODE=700
TILA=/srv/kauppa/data /srv/kauppa/logs
KONFIG=/srv/kauppa/.env /srv/kauppa/llm.env
PALVELUT=kauppa-ajo kauppa-data kauppa-k7 kauppa-k7-kuiva kauppa-retro kauppa-sykemittari
AJASTIMET=kauppa-ajo.timer kauppa-k7-kuiva.timer kauppa-k7.timer kauppa-retro.timer kauppa-sykemittari.timer
PROSESSI_KUVIO=/srv/kauppa/k1/
IKKUNA_S=120
# Vaihe 1 (CT119 vaiheessa 2: ASENTAJA=yleinen): kayttaa kontin olemassa olevaa kauppa-asenna/kauppa-palauta-asentajaa.
ASENTAJA=kauppa-asenna
POIS=README.md LICENSE .gitignore .github
VAADITUT=paiva.py rajat.py salkku.py backtest.py
TESTI_TAPA=kontti
TESTI_KAYTTAJA=kauppa
TESTI_ARGUMENTIT=discover
SAVU_KAYTTAJA=kauppa
SAVU_MODUULIT=rajat backtest salkku paiva
# Yksikot ovat paketin juuressa; kauppa-asenna kopioi muuttuneet /etc/systemd/system-hakemistoon.
YKSIKOT_ASENNUS=1
YKSIKKOKANSIO=.
PREV_MAARA=3
