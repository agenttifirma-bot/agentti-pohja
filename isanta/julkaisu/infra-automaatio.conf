# Julkaisun kohde: infra-automaatio (CT118). Vain dataa (ei source). Asennus: /root/julkaisu/infra-automaatio.conf (root, 0600).
KOHDE=infra-automaatio
CT=118
REPO=tonyweckstrom1987/infra-automaatio
# Yksityinen repo: isanta ei voi lukea sita ilman uutta tunnusta, joten main-karkea ei tarkisteta isannalta (paketin commit tarkistetaan aina).
JULKINEN=0
HAARA=main
KOODI=/opt/infra-automaatio
KOODI_OMISTAJA=root:root
KOODI_MODE=755
TILA=/var/lib/infra-automaatio
KONFIG=/etc/infra-automaatio
PALVELUT=infra-komennot infra-raportti
AJASTIMET=infra-komennot.timer infra-raportti.timer
PROSESSI_KUVIO=/opt/infra-automaatio/
LUKOT=/var/lib/infra-automaatio/komennot.lock
# infra-komennot.timer laukeaa 2 min valein: vaihto vaatii vahintaan taman verran aikaa seuraavaan laukeamiseen
IKKUNA_S=20
ASENTAJA=yleinen
POIS=.gitignore
VAADITUT=run.py config.py komennot.py ehdotukset.py snapshot.py
# Testeja EI ajeta CT118:ssa (tuotantokontti), vaan CT115:n tilapaishakemistossa.
TESTI_TAPA=ct115
TESTI_CT=115
TESTI_ARGUMENTIT=discover -s tests
SAVU_KAYTTAJA=infra
SAVU_MODUULIT=config run komennot ehdotukset snapshot report rules
# Systemd-yksikot ovat paketin hakemistossa systemd/; ne asennetaan KASIN (lakimuutos: koventaminen), julkaisu vain raportoi erot.
YKSIKOT_ASENNUS=0
YKSIKKOKANSIO=systemd
PREV_MAARA=3
