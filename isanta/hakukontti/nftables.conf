#!/usr/sbin/nft -f
# Hakukontin palomuuri ja kill switch (pohja). Asennus: /etc/nftables.conf (root:root 0644). Ohje: docs/aivo-hakukontti.md.
# Periaate: jos Tor tai WireGuard-VPN (wg0) ei ole ylhaalla, haku epaonnistuu. Sovelluskayttajat (searxng, aivo-haku,
# _apt) paasevat vain silmukkaosoitteen Tor-porttiin. Vain debian-tor saa ottaa yhteyden internetiin, ja vain wg0:n
# kautta TCP:lla. eth0:sta lahtee vain ytimen WireGuard-liikenne (UDP) VPN-palvelimelle ja vastaukset kontille 122.
# Jos wg0 on alhaalla, mitaan ei lahde ulos.
# Yksityisiin ja erikoisosoitteisiin (KIELLETYT4/6 alla seka asennuksen LAHIVERKOT4) ei paase kukaan, ei myoskaan root
# eika debian-tor. Ainoa poikkeus on vastausliikenne kontille 122 hakuvalittajan portista 8890 (jo avattu yhteys).
# Nimipalvelua (portti 53) ei sallita kenellekaan: socks5h ja torsocks ratkaisevat nimet Torin kautta.
# Osoitteet (kontti 122, lahiverkot ja WireGuard-palvelin WG_PALVELIN:WG_PORTTI) kirjoitetaan asennuksessa komennoilla
# tiedostoon hakukontti-osoitteet.nft. WireGuard-palvelin luetaan wg0.confin Endpoint-rivista (wg_asetus.py nft).

flush ruleset

include "/etc/nftables.d/hakukontti-osoitteet.nft"

# Standardien yksityiset ja erikoisalueet (RFC 1918, 6598, 3927, 1122, 6890, 2544, 5771, 1112; RFC 4193, 4291, 6052, 3879).
# Naissa ei ole infran osoitteita, vain alueiden maaritelmat.
define KIELLETYT4 = { 0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.168.0.0/16, 198.18.0.0/15, 224.0.0.0/4, 240.0.0.0/4 }
define KIELLETYT6 = { ::/128, ::1/128, ::ffff:0:0/96, 64:ff9b::/96, fc00::/7, fe80::/10, fec0::/10, ff00::/8 }

table inet hakukontti {
	chain input {
		type filter hook input priority filter; policy drop;
		iif "lo" accept
		ct state established,related accept
		ct state invalid drop
		icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
		# Hakuvalittaja (PR 2) kuuntelee porttia 8890. Vain kontti 122.
		iifname "eth0" ip saddr $CT122 tcp dport 8890 ct state new accept
		counter comment "hylatty sisaan"
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy drop;
		ct state invalid drop
		# IPv6-naapurinhaku (linkkipaikallinen ja monilahetys) on pakollinen IPv6-yhteydelle. Vain ICMPv6-tyypit, ei dataa.
		icmpv6 type { nd-router-solicit, nd-neighbor-solicit, nd-neighbor-advert, mld2-listener-report } accept
		# Silmukkaosoite: root kaikkialle (yllapito ja testit), sovelluskayttajat vain tarvitsemiinsa portteihin.
		oif "lo" ct state established,related accept
		oif "lo" meta skuid "root" accept
		oif "lo" meta skuid "searxng" tcp dport 9050 accept
		oif "lo" meta skuid "aivo-haku" tcp dport { 8888, 9050 } accept
		oif "lo" meta skuid "_apt" tcp dport 9050 accept
		# Ainoa sallittu yksityinen kohde: vastaukset kontille 122 hakuvalittajan portista (yhteyden avasi kontti 122).
		oifname "eth0" ip daddr $CT122 tcp sport 8890 ct state established accept
		# Yksityiset ja erikoisosoitteet: ei kenellekaan, ei myoskaan avatuissa yhteyksissa.
		ip daddr $KIELLETYT4 counter drop comment "yksityinen tai erikoisosoite"
		ip daddr $LAHIVERKOT4 counter drop comment "lahiverkko"
		ip6 daddr $KIELLETYT6 counter drop comment "yksityinen tai erikoisosoite"
		# IPv6 ei ole kaytossa ulosmenoon (Tor kayttaa IPv4:aa). Jos reititin jakaa IPv6-etuliitteen (SLAAC), lahiverkon
		# laitteilla on globaaleja IPv6-osoitteita, joita KIELLETYT6 ei kata: siksi kaikki muu IPv6 estetaan.
		meta nfproto ipv6 counter drop comment "ei IPv6-ulosmenoa"
		# WireGuard: ytimen wg-soketti merkitsee pakettinsa (wg-quick: fwmark 51820 = 0xca6c). Merkin voi asettaa vain
		# root (CAP_NET_ADMIN), joten sovelluskayttajat eivat voi kayttaa tata saantoa. Ytimen soketilla ei ole kayttajaa,
		# joten skuid ei sovi tahan.
		oifname "eth0" meta mark 0x0000ca6c ip daddr $WG_PALVELIN udp dport $WG_PORTTI accept
		# Muu eth0-liikenne estetaan ennen avattujen yhteyksien sallintaa: jos wg0 katoaa kesken Tor-yhteyden, vanhan
		# yhteyden paketit eivat saa reitittya eth0:aan (Tor-liikenne nakyisi muuten sijoittajan yhteydessa).
		oifname "eth0" counter drop comment "eth0: vain WireGuard-palvelimelle"
		ct state established,related accept
		# Tor: internetiin vain wg0:n kautta ja vain TCP:lla (yksityiset osoitteet on estetty ylla). Tor ei tarvitse
		# UDP:ta, joten UDP (myos portti 53) osuu kill switchiin.
		meta skuid "debian-tor" oifname "wg0" meta l4proto tcp accept
		counter comment "kill switch: hylatty ulos"
	}
}
