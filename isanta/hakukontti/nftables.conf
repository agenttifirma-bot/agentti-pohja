#!/usr/sbin/nft -f
# Hakukontin palomuuri ja kill switch (pohja). Asennus: /etc/nftables.conf (root:root 0644). Ohje: docs/aivo-hakukontti.md.
# Periaate: jos Tor ei ole ylhaalla, haku epaonnistuu. Sovelluskayttajat (searxng, aivo-haku, _apt) paasevat vain
# silmukkaosoitteen Tor-porttiin. Vain debian-tor saa ottaa yhteyden internetiin, ei kuitenkaan lahiverkkoihin.
# Nimipalvelua (portti 53) ei sallita kenellekaan: socks5h ja torsocks ratkaisevat nimet Torin kautta.
# Osoitteet (kontti 122 ja lahiverkot) kirjoitetaan asennuksessa komennoilla tiedostoon hakukontti-osoitteet.nft.

flush ruleset

include "/etc/nftables.d/hakukontti-osoitteet.nft"

table inet hakukontti {
	chain input {
		type filter hook input priority filter; policy drop;
		iif "lo" accept
		ct state established,related accept
		ct state invalid drop
		icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
		# Hakuvalittaja (PR 2) kuuntelee porttia 8890. Vain kontti 122.
		iifname "eth0" ip saddr $CT122 tcp dport 8890 ct state new accept
		counter comment "hylatty sisaan"
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy drop;
		ct state established,related accept
		ct state invalid drop
		icmpv6 type { nd-router-solicit, nd-neighbor-solicit, nd-neighbor-advert, mld2-listener-report } accept
		# Silmukkaosoite: root kaikkialle (yllapito ja testit), sovelluskayttajat vain tarvitsemiinsa portteihin.
		oif "lo" meta skuid "root" accept
		oif "lo" meta skuid "searxng" tcp dport 9050 accept
		oif "lo" meta skuid "aivo-haku" tcp dport { 8888, 9050 } accept
		oif "lo" meta skuid "_apt" tcp dport 9050 accept
		# Tor: internetiin, mutta ei lahiverkkoihin eika tailnetiin.
		meta skuid "debian-tor" ip daddr $LAHIVERKOT4 counter drop
		meta skuid "debian-tor" ip6 daddr { fc00::/7, fe80::/10 } counter drop
		meta skuid "debian-tor" oifname "eth0" accept
		counter comment "kill switch: hylatty ulos"
	}
}
