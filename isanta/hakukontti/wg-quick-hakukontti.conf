# wg-quick@wg0 hakukontissa: lisaosa (drop-in). Asennus: /etc/systemd/system/wg-quick@wg0.service.d/hakukontti.conf
# (root:root 0644). Ohje: docs/aivo-hakukontti.md.
# WireGuard nostetaan vasta, kun palomuuri (kill switch) on ladattu. Palomuurin pysaytys tai uudelleenkaynnistys
# pysayttaa tai kaynnistaa myos taman (Requires=), jolloin myos Tor ja haku pysahtyvat.
# Asetustiedosto /etc/wireguard/wg0.conf (root:root 0600) tuodaan erikseen; repossa on vain wg0.conf.esimerkki.
[Unit]
Requires=nftables.service
After=nftables.service
