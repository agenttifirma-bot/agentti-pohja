# Tor hakukontissa: lisaosa (drop-in). Asennus: /etc/systemd/system/tor@default.service.d/hakukontti.conf
# (root:root 0644). Ohje: docs/aivo-hakukontti.md.
# Tor kaynnistyy vasta palomuurin ja WireGuard-VPN:n (wg-quick@wg0) jalkeen, ja pysahtyy, jos jompikumpi pysaytetaan.
# Torin liikenne kulkee siis aina VPN:n sisalla: palomuuri sallii debian-torille vain wg0:n.
[Unit]
Requires=nftables.service wg-quick@wg0.service
After=nftables.service wg-quick@wg0.service
