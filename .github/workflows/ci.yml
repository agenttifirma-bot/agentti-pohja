name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Aseta Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Testit
        # Kaatuneet testit nakyvat check-runin annotaatioina (tunnus + poikkeuksen tyyppi); paluuarvo kuten unittestilla.
        run: python -m tools.ci_testit

      - name: Kuiva-ajo (ei verkkoa)
        run: python -m agentti --tila "$RUNNER_TEMP/tila"

      - name: Uuden agentin luonti toimii (luo.py)
        run: |
          python luo.py testiagentti
          python -m agentti --agentti testiagentti --tila "$RUNNER_TEMP/tila"

  # CHANGELOG.md:ta ei muokata PR:ssa: rivi kuuluu fragmenttiin docs/muutokset/ (kokoaja: tools/changelog_kokoa.py).
  # Oma tyo, ei matriisissa eika vaadittu tarkistus.
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: CHANGELOG.md ei saa muuttua suoraan
        run: python3 tools/changelog_tarkista.py --pohja "origin/${{ github.base_ref }}" .

  # README lupaa "Linux tai macOS": tama pitaa lupauksen todennettuna. Oma tyo (ei matriisissa), jotta
  # vaaditut tarkistukset `test (3.10)` ... `test (3.13)` pysyvat ennallaan. Ei ole vaadittu tarkistus.
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Aseta Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Testit
        # Kaatuneet testit nakyvat check-runin annotaatioina (tunnus + poikkeuksen tyyppi); paluuarvo kuten unittestilla.
        run: python -m tools.ci_testit

      - name: Kuiva-ajo (ei verkkoa)
        run: python -m agentti --tila "$RUNNER_TEMP/tila"

      - name: Uuden agentin luonti toimii (luo.py)
        run: |
          python luo.py testiagentti
          python -m agentti --agentti testiagentti --tila "$RUNNER_TEMP/tila"
