name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Aseta Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Testit
        run: python -m unittest discover -s . -t . -p 'test_*.py' -v

      - name: Kuiva-ajo (ei verkkoa)
        run: python -m agentti --tila "$RUNNER_TEMP/tila"

      - name: Uuden agentin luonti toimii (luo.py)
        run: |
          python luo.py testiagentti
          python -m agentti --agentti testiagentti --tila "$RUNNER_TEMP/tila"

  # README lupaa "Linux tai macOS": tama pitaa lupauksen todennettuna. Oma tyo (ei matriisissa), jotta
  # vaaditut tarkistukset `test (3.10)` ... `test (3.13)` pysyvat ennallaan. Ei ole vaadittu tarkistus.
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Aseta Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Testit
        run: python -m unittest discover -s . -t . -p 'test_*.py' -v

      - name: Kuiva-ajo (ei verkkoa)
        run: python -m agentti --tila "$RUNNER_TEMP/tila"

      - name: Uuden agentin luonti toimii (luo.py)
        run: |
          python luo.py testiagentti
          python -m agentti --agentti testiagentti --tila "$RUNNER_TEMP/tila"
